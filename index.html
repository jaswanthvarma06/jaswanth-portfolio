<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaswanth Varma | AI & ML Developer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d0614 0%, #170b28 50%, #0a0410 100%);
      --card-bg: rgba(22, 16, 35, 0.75);
      --card-border: rgba(168, 85, 247, 0.2);
      --accent-purple: #a855f7;
      --accent-glow: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Main Container Card */
    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(139, 92, 246, 0.15);
      padding: 2.5rem 3rem;
      position: relative;
      overflow: hidden;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }
    .logo span { color: var(--accent-purple); }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--text-main);
    }

    .btn-talk {
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: 0.3s;
    }
    .btn-talk:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    /* Hero Layout */
    .hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 2rem;
    }

    .hero-content {
      padding-right: 1rem;
    }

    .greeting {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .role-title {
      font-size: 3.2rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .role-title span {
      color: var(--accent-purple);
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    .bio {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      max-width: 520px;
    }

    /* Action Buttons */
    .cta-group {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .btn-primary {
      background: #1e1b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--accent-purple);
      color: var(--accent-purple);
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(168, 85, 247, 0.1);
    }

    /* Social Icons */
    .social-links {
      display: flex;
      gap: 1rem;
    }

    .social-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: 0.3s;
    }

    .social-icon:hover {
      color: #fff;
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.2);
    }

    /* Profile Graphic Area */
    .hero-image {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-glow {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,85,247,0.3) 0%, rgba(0,0,0,0) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed rgba(168, 85, 247, 0.4);
    }

    .avatar-placeholder {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #170f26;
      border: 2px solid var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      color: var(--accent-purple);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
    }

    @media (max-width: 868px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .hero-content { padding-right: 0; }
      .bio { margin: 0 auto 2rem auto; }
      .cta-group { justify-content: center; }
      .social-links { justify-content: center; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation Bar -->
    <nav>
      <div class="logo">JASWANTH<span>.</span></div>
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <a href="mailto:your-email@gmail.com" class="btn-talk">Let's Talk</a>
    </nav>

    <!-- Main Hero Section -->
    <section class="hero">
      <div class="hero-content">
        <p class="greeting">Hi, I'm Jaswanth Varma!</p>
        <h1 class="role-title">AI & ML <span>DEVELOPER</span></h1>
        <p class="bio">
          Specializing in Artificial Intelligence and Machine Learning. Passionate about engineering smart applications, computer vision models, and full-stack web solutions.
        </p>

        <div class="cta-group">
          <a href="https://handwritten-digit-recognition-zei5.onrender.com" target="_blank" class="btn-primary">
            PROJECTS <i class="fa-solid fa-code"></i>
          </a>
          <a href="https://github.com/jaswanthvarma06" target="_blank" class="btn-secondary">
            GITHUB <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
        </div>

        <div class="social-links">
          <a href="https://github.com/jaswanthvarma06" target="_blank" class="social-icon"><i class="fa-brands fa-github"></i></a>
          <a href="#" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
      </div>

      <!-- Avatar / Image Section -->
      <div class="hero-image">
        <div class="avatar-glow">
          <div class="avatar-placeholder">
            <i class="fa-solid fa-laptop-code"></i>
          </div>
        </div>
      </div>
    </section>
  </div>

</body>
</html>
